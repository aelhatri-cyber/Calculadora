<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <h1>Calculadora matemática</h1>

    <label for="numero1">Primer número:</label>
    <input type="number" id="numero1" min="-99999" max="99999" step="1">
    <br><br>

    <label for="numero2">Segundo número:</label>
    <input type="number" id="numero2" min="-99999" max="99999" step="1">
    <br><br>

    <label for="operacion">Operación:</label>
    <select id="operacion">
        <option value="suma">Suma</option>
        <option value="resta">Resta</option>
        <option value="multiplicacion">Multiplicación</option>
        <option value="potencia">Potencia</option>
    </select>
    <br><br>

    <button type="button" onclick="calcular()">Calcular</button>

    <h2 id="resultado">Resultado:</h2>
    <script>
        async function calcular() {
            const numero1 = document.getElementById("numero1").value;
            const numero2 = document.getElementById("numero2").value;
            const operacion = document.getElementById("operacion").value;

            const respuesta = await fetch("http://localhost:8080/calcular", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    numero1: numero1,
                    numero2: numero2,
                    operacion: operacion
                })
            });

            const datos = await respuesta.json();

            document.getElementById("resultado").textContent = "Resultado: " + (datos.resultado ?? datos.error);
        }
    </script>
</body>
</html>
